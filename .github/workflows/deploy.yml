# Builds the site with build.py and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:          # the "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py           # standard library only — nothing to install
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
